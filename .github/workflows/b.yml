name: Extract OTA Images (Android 9)

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'OTA 包的下载链接'
        required: true
        type: string
        # 这里已经直接填入了您提供的地址
        default: 'https://github.com/coara-chocomaru/test-false/releases/download/a/SZJ-JS202_1.000JS.0072.a_user_to_1.032JS.0090.a_user.zip'

env:
  WORK_DIR: 'ota_work'
  OUTPUT_DIR: 'extracted_images'

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3 python3-pip android-sdk-libsparse-utils bsdiff git file
          pip3 install protobuf

      - name: 克隆并准备工具 (sdat2img + imgpatchtools)
        run: |
          git clone https://github.com/xpirt/sdat2img.git /tmp/sdat2img
          chmod +x /tmp/sdat2img/sdat2img.py

          git clone https://github.com/erfanoabdi/imgpatchtools.git /tmp/imgpatchtools
          find /tmp/imgpatchtools -type f -name "*.py" -exec chmod +x {} \;

      - name: 创建工作目录
        run: |
          mkdir -p ${{ env.WORK_DIR }} ${{ env.OUTPUT_DIR }}

      - name: 下载 OTA 包
        run: |
          wget --no-check-certificate -O ${{ env.WORK_DIR }}/ota.zip "${{ github.event.inputs.ota_url }}"
        continue-on-error: true

      - name: 解压 OTA 包
        run: |
          unzip -o ${{ env.WORK_DIR }}/ota.zip -d ${{ env.WORK_DIR }}/ota_extracted/
        continue-on-error: true

      - name: 转换 .new.dat 为 .img (使用 sdat2img)
        run: |
          # 查找所有 .new.dat 文件并尝试转换
          for newdat in $(find ${{ env.WORK_DIR }}/ota_extracted -type f -name "*.new.dat"); do
            echo "处理 $newdat"
            base=$(basename "$newdat" .new.dat)
            transfer=$(find ${{ env.WORK_DIR }}/ota_extracted -type f -name "${base}.transfer.list" | head -1)
            if [ -f "$transfer" ]; then
              python3 /tmp/sdat2img/sdat2img.py "$transfer" "$newdat" "${{ env.OUTPUT_DIR }}/${base}.img"
            else
              echo "未找到 ${base}.transfer.list，跳过转换"
            fi
          done
        continue-on-error: true

      - name: 直接复制已存在的完整镜像
        run: |
          find ${{ env.WORK_DIR }}/ota_extracted -type f -name "system.img" -exec cp {} ${{ env.OUTPUT_DIR }}/ \;
          find ${{ env.WORK_DIR }}/ota_extracted -type f -name "vendor.img" -exec cp {} ${{ env.OUTPUT_DIR }}/ \;
        continue-on-error: true

      - name: 尝试应用差分补丁
        run: |
          find ${{ env.WORK_DIR }}/ota_extracted -type f \( -name "*.patch" -o -name "*.patch.dat" \) > /tmp/patch_list.txt
          for patch in $(cat /tmp/patch_list.txt); do
            echo "尝试应用补丁: $patch"
            if echo "$patch" | grep -qi "system"; then
              TARGET_IMG="${{ env.OUTPUT_DIR }}/system.img"
              [ -f "$TARGET_IMG" ] && python3 /tmp/imgpatchtools/applypatch.py "$patch" "$TARGET_IMG" || echo "system.img 不存在或补丁应用失败"
            elif echo "$patch" | grep -qi "vendor"; then
              TARGET_IMG="${{ env.OUTPUT_DIR }}/vendor.img"
              [ -f "$TARGET_IMG" ] && python3 /tmp/imgpatchtools/applypatch.py "$patch" "$TARGET_IMG" || echo "vendor.img 不存在或补丁应用失败"
            fi
          done
        continue-on-error: true

      - name: 处理块级 OTA (payload.bin)
        run: |
          if [ -f "${{ env.WORK_DIR }}/ota_extracted/payload.bin" ]; then
            cp ${{ env.WORK_DIR }}/ota_extracted/payload.bin ${{ env.OUTPUT_DIR }}/
          fi
        continue-on-error: true

      - name: 收集所有相关文件
        run: |
          find ${{ env.WORK_DIR }}/ota_extracted -type f \( -name "*.img" -o -name "*.patch" -o -name "*.dat" -o -name "*.list" -o -name "updater-script" -o -name "metadata" \) -exec cp {} ${{ env.OUTPUT_DIR }}/ \;
          ls -la ${{ env.OUTPUT_DIR }}/
        continue-on-error: true

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: ota_extracted_images
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 7
