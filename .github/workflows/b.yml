name: Extract OTA Images (Android 9)

on:
  push:
    branches:
      - a 

  pull_request:
    branches:
      - a
      
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'OTA 包的下载链接（支持 .zip 或 .bin）'
        required: true
        type: string
        default: 'http://d15ze2y2hx4s9h.cloudfront.net/platforms/v2/szj_js202/com.justsystems.smilehs.platform/stable/SZJ-JS202_1.000JS.0072.a_user_to_1.032JS.0090.a_user.zip'

env:
  WORK_DIR: 'ota_work'
  OUTPUT_DIR: 'extracted_images'

jobs:
  extract:
    runs-on: ubuntu-22.04  # 使用当前受支持的 Ubuntu LTS 版本
    steps:
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            python3 \
            android-sdk-libsparse-utils \
            bsdiff \
            git \
            file
          # 克隆 imgpatchtools（用于应用差分补丁）
          git clone https://github.com/erfanoabdi/imgpatchtools.git /tmp/imgpatchtools
          chmod +x /tmp/imgpatchtools/*.py

      - name: 创建工作目录
        run: |
          mkdir -p ${{ env.WORK_DIR }} ${{ env.OUTPUT_DIR }}

      - name: 下载 OTA 包
        run: |
          wget --no-check-certificate -O ${{ env.WORK_DIR }}/ota.zip "${{ github.event.inputs.ota_url }}"
        continue-on-error: true   # 即使下载失败也继续（后续会处理）

      - name: 解压 OTA 包
        run: |
          unzip -o ${{ env.WORK_DIR }}/ota.zip -d ${{ env.WORK_DIR }}/ota_extracted/ || echo "解压部分文件失败，继续..."
        continue-on-error: true

      - name: 查找差分补丁文件
        id: find_patches
        run: |
          find ${{ env.WORK_DIR }}/ota_extracted -type f \( -name "*system*.patch" -o -name "*vendor*.patch" -o -name "*.patch.dat" \) > /tmp/patch_list.txt || true
          cat /tmp/patch_list.txt || echo "未找到补丁文件"
        continue-on-error: true

      - name: 提取已存在的完整镜像
        run: |
          find ${{ env.WORK_DIR }}/ota_extracted -type f -name "system.img" -exec cp {} ${{ env.OUTPUT_DIR }}/ \; || echo "未找到 system.img"
          find ${{ env.WORK_DIR }}/ota_extracted -type f -name "vendor.img" -exec cp {} ${{ env.OUTPUT_DIR }}/ \; || echo "未找到 vendor.img"
        continue-on-error: true

      - name: 强制应用差分补丁（忽略错误）
        run: |
          # 遍历所有发现的补丁文件
          for patch in $(cat /tmp/patch_list.txt 2>/dev/null || echo ""); do
            echo "处理补丁: $patch"
            if echo "$patch" | grep -qi "system"; then
              TARGET_IMG="${{ env.OUTPUT_DIR }}/system.img"
              # 如果目标镜像不存在，尝试从 OTA 包中复制一个基础镜像（若有）
              if [ ! -f "$TARGET_IMG" ]; then
                find ${{ env.WORK_DIR }}/ota_extracted -type f -name "system.img" -exec cp {} ${{ env.OUTPUT_DIR }}/ \; || echo "未找到基础 system.img"
              fi
              # 应用补丁，忽略所有错误
              python3 /tmp/imgpatchtools/applypatch.py "$patch" "$TARGET_IMG" 2>/dev/null || echo "system.img 补丁应用失败（已忽略）"
            elif echo "$patch" | grep -qi "vendor"; then
              TARGET_IMG="${{ env.OUTPUT_DIR }}/vendor.img"
              if [ ! -f "$TARGET_IMG" ]; then
                find ${{ env.WORK_DIR }}/ota_extracted -type f -name "vendor.img" -exec cp {} ${{ env.OUTPUT_DIR }}/ \; || echo "未找到基础 vendor.img"
              fi
              python3 /tmp/imgpatchtools/applypatch.py "$patch" "$TARGET_IMG" 2>/dev/null || echo "vendor.img 补丁应用失败（已忽略）"
            fi
          done
        continue-on-error: true

      - name: 处理块级 OTA（payload.bin）
        run: |
          if [ -f "${{ env.WORK_DIR }}/ota_extracted/payload.bin" ]; then
            echo "检测到 payload.bin，尝试复制"
            cp ${{ env.WORK_DIR }}/ota_extracted/payload.bin ${{ env.OUTPUT_DIR }}/ || echo "payload.bin 复制失败"
          fi
        continue-on-error: true

      - name: 收集所有相关文件（镜像、补丁、更新脚本等）
        run: |
          # 复制所有 .img, .patch, .dat 文件
          find ${{ env.WORK_DIR }}/ota_extracted -type f \( -name "*.img" -o -name "*.patch" -o -name "*.dat" \) -exec cp {} ${{ env.OUTPUT_DIR }}/ \; 2>/dev/null || true
          # 复制 updater-script（若有）
          find ${{ env.WORK_DIR }}/ota_extracted -type f -name "updater-script" -exec cp {} ${{ env.OUTPUT_DIR }}/ \; 2>/dev/null || true
          # 列出输出目录内容
          ls -la ${{ env.OUTPUT_DIR }}/ || echo "输出目录为空"
        continue-on-error: true

      - name: 上传提取结果作为工件（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ota_extracted_images
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 7
