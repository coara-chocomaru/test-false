          def main():

              for directory in [
                  FILE_ROOT,
                  EXTRACTION_ROOT,
                  WORK_ROOT,
                  REPORT_ROOT,
                  REPORT_FILES_ROOT,
                  DISASSEMBLY_ROOT,
                  RAW_ROOT,
                  LOG_ROOT
              ]:

                  directory.mkdir(
                      parents=True,
                      exist_ok=True
                  )

              if not INPUT_ZIP.is_file():

                  print(
                      f"Input ZIP not found: {INPUT_ZIP}"
                  )

                  return 10

              if INPUT_ZIP.stat().st_size <= 0:

                  print(
                      "Input ZIP is empty."
                  )

                  return 11

              source_root = (
                  FILE_ROOT
                  / "source"
              )

              source_root.mkdir(
                  parents=True,
                  exist_ok=True
              )

              try:

                  initial_files = extract_zip(
                      INPUT_ZIP,
                      source_root
                  )

              except Exception as exc:

                  print(
                      f"Initial ZIP extraction failed: {exc}"
                  )

                  with open(
                      LOG_ROOT
                      / "initial_extraction_error.txt",
                      "w",
                      encoding="utf-8"
                  ) as output:

                      traceback.print_exc(
                          file=output
                      )

                  return 12

              discovered = []

              for item in initial_files:

                  if not os.path.isfile(
                      item
                  ):
                      continue

                  try:
                      item_hash = sha256_file(
                          item
                      )
                  except Exception:
                      continue

                  discovered.append(
                      {
                          "path": item,
                          "parent": str(
                              INPUT_ZIP
                          ),
                          "depth": 1,
                          "sha256": item_hash
                      }
                  )

              extraction_queue = deque(
                  discovered
              )

              expanded_hashes = set()

              extraction_log = []

              while extraction_queue:

                  current = (
                      extraction_queue.popleft()
                  )

                  if (
                      len(discovered)
                      >= MAX_FILES
                  ):
                      break

                  relative_name = os.path.relpath(
                      current["path"],
                      FILE_ROOT
                  )

                  generated = (
                      recursively_extract(
                          current["path"],
                          relative_name,
                          int(
                              current.get(
                                  "depth",
                                  1
                              )
                          ),
                          expanded_hashes,
                          extraction_log
                      )
                  )

                  for item in generated:

                      if (
                          len(discovered)
                          >= MAX_FILES
                      ):
                          break

                      discovered.append(
                          item
                      )

                      extraction_queue.append(
                          item
                      )

              with open(
                  LOG_ROOT
                  / "recursive_extraction.json",
                  "w",
                  encoding="utf-8"
              ) as output:

                  json.dump(
                      extraction_log,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              discovered.sort(
                  key=lambda item: (
                      int(
                          item.get(
                              "depth",
                              0
                          )
                      ),
                      str(
                          item.get(
                              "path",
                              ""
                          )
                      )
                  )
              )

              summaries = []
              failures = []

              total_files = len(
                  discovered
              )

              for index, item in enumerate(
                  discovered,
                  1
              ):

                  path = item[
                      "path"
                  ]

                  relative_name = os.path.relpath(
                      path,
                      FILE_ROOT
                  )

                  print(
                      f"[{index}/{total_files}] "
                      f"Analyzing {relative_name}",
                      flush=True
                  )

                  try:

                      summary = analyze_file(
                          path,
                          relative_name,
                          index,
                          item.get(
                              "parent"
                          ),
                          int(
                              item.get(
                                  "depth",
                                  1
                              )
                          )
                      )

                      summaries.append(
                          summary
                      )

                  except Exception as exc:

                      failure = {
                          "sequence": index,
                          "relative_name": relative_name,
                          "path": path,
                          "parent": item.get(
                              "parent"
                          ),
                          "depth": item.get(
                              "depth",
                              1
                          ),
                          "error": str(exc)
                      }

                      failures.append(
                          failure
                      )

                      with open(
                          LOG_ROOT
                          / "failures.log",
                          "a",
                          encoding="utf-8"
                      ) as output:

                          output.write(
                              json.dumps(
                                  failure,
                                  ensure_ascii=False
                              )
                          )

                          output.write(
                              "\n"
                          )

                      print(
                          f"FAILED: "
                          f"{relative_name}: "
                          f"{exc}",
                          flush=True
                      )

