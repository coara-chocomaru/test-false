          )

          print(
              f"Manifest={manifest_path}"
          )
          PYEOF

      - name: Collect Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            "${ARTIFACT_ROOT}/logs"

          {
            echo "===== DATE ====="
            date -u

            echo "===== PWD ====="
            pwd

            echo "===== WORKSPACE_ROOT ====="
            echo "${WORKSPACE_ROOT}"

            echo "===== ANALYSIS_ROOT ====="
            echo "${ANALYSIS_ROOT}"

            echo "===== ARTIFACT_ROOT ====="
            echo "${ARTIFACT_ROOT}"

            echo "===== UNAME ====="
            uname -a

            echo "===== CPU ====="
            nproc

            echo "===== MEMORY ====="
            free -h

            echo "===== DISK ====="
            df -h

            echo "===== PATH ====="
            echo "${PATH}"

            echo "===== LD_LIBRARY_PATH ====="
            echo "${LD_LIBRARY_PATH}"

            echo "===== TOOLS ====="

            for command_name in \
              r2 \
              rabin2 \
              rasm2 \
              ldconfig \
              python3 \
              file \
              strings \
              7z \
              unzip \
              tar \
              xz \
              gzip \
              bzip2 \
              binwalk
            do

              if command -v \
                "${command_name}" \
                >/dev/null 2>&1
              then

                echo \
                  "${command_name}=$(command -v "${command_name}")"

              else

                echo \
                  "${command_name}=NOT_FOUND"

              fi

            done

            echo "===== RADARE2 ====="

            if command -v r2 >/dev/null 2>&1; then
              r2 -v
            fi

            if command -v rabin2 >/dev/null 2>&1; then
              rabin2 -v
            fi

            if command -v rasm2 >/dev/null 2>&1; then
              rasm2 -v
            fi

            echo "===== FILE TREE ====="

            if [ -d "${ARTIFACT_ROOT}" ]; then

              find \
                "${ARTIFACT_ROOT}" \
                -maxdepth 12 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort

            else

              echo "Artifact root missing"

            fi

          } > \
            "${ARTIFACT_ROOT}/logs/final_diagnostics.log" \
            2>&1

      - name: Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_full_recursive_analysis
          path: |
            artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Success Notice
        if: success()
        shell: bash
        run: |
          echo "::notice title=QCOM Bootloader Analysis Complete::Recursive extraction, full file analysis, disassembly and reports completed successfully."

      - name: Failure Notice
        if: failure()
        shell: bash
        run: |
          echo "::error title=QCOM Bootloader Analysis Failed::The workflow failed. Diagnostics and generated artifacts were uploaded."
          exit 1
